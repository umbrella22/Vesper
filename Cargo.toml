[workspace]
members = [
    "crates/model/*",
    "crates/core/*",
    "crates/ffi/*",
    "crates/plugin/*",
    "crates/plugin-decoder/*",
    "crates/plugin-remux/*",
    "crates/audio/*",
    "crates/render/*",
    "crates/backend/*",
    "crates/platform/common/*",
    "crates/platform/desktop/*",
    "crates/platform/mobile/*",
    "crates/platform/jni/*",
    "crates/tools/*",
    "examples/basic-player",
]
resolver = "3"

[workspace.package]
authors = ["umbrella22"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/umbrella22/Vesper"
rust-version = "1.97"
version = "0.4.0"

[workspace.dependencies]
anyhow = "1.0.103"
clap = { version = "4.5.60", features = ["derive"] }
cpal = "0.18.1"
crossbeam-queue = "0.3.12"
dlmalloc = { version = "0.2.14", features = ["global"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
ffmpeg-next = { version = "8.1.0", default-features = false }
flate2 = "1.1.9"
indexmap = { version = "2.14.0", features = ["serde"] }
libloading = "0.9.0"
nix = { version = "0.29.0", default-features = false, features = ["process", "signal"] }
pollster = "1.0.1"
proc-macro2 = "1.0.106"
quick-xml = "0.39.4"
quote = "1.0.45"
rand_core = { version = "0.6.4", features = ["getrandom"] }
regex = "1.13.0"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
semver = "1.0.27"
sha1 = "0.10.6"
sha2 = "0.10.9"
signal-hook = "0.3.18"
syn = { version = "2.0.117", features = ["full"] }
tar = "0.4.44"
tempfile = "3.26.0"
thiserror = "2.0.18"
toml = { version = "1.1.3", features = ["preserve_order"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-casefold = "0.2.0"
unicode-normalization = "0.1.25"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde"] }
wasmtime = { version = "47.0.2", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std"] }
wat = "1.252.0"
wit-bindgen = { version = "0.57.1", default-features = false, features = ["macros", "realloc"] }
wit-component = "0.247.0"
wit-parser = "0.247.0"
zip = { version = "6.0.0", default-features = false }
xz2 = "0.1.7"
x509-parser = "0.18.1"
wgpu = "30.0.0"
winit = "0.30.13"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
