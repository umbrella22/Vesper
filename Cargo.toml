[workspace]
members = [
    "crates/model/*",
    "crates/core/*",
    "crates/ffi/*",
    "crates/plugin/*",
    "crates/plugin-decoder/*",
    "crates/plugin-remux/*",
    "crates/audio/*",
    "crates/render/*",
    "crates/backend/*",
    "crates/platform/common/*",
    "crates/platform/desktop/*",
    "crates/platform/mobile/*",
    "crates/platform/jni/*",
    "crates/tools/*",
    "examples/basic-player",
]
resolver = "3"

[workspace.package]
authors = ["umbrella22"]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"
version = "0.4.0"

[workspace.dependencies]
anyhow = "1.0.103"
cpal = "0.18.1"
crossbeam-queue = "0.3.12"
ffmpeg-next = { version = "8.1.0", default-features = false }
libloading = "0.9.0"
pollster = "1.0.1"
quick-xml = "0.39.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.7"
wgpu = "30.0.0"
winit = "0.30.13"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
