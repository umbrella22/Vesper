[package]
name = "basic-player"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ab_glyph_rasterizer = "0.1.10"
anyhow.workspace = true
pollster.workspace = true
player-model = { path = "../../crates/model/player-model" }
player-backend-ffmpeg = { path = "../../crates/backend/player-backend-ffmpeg" }
player-host-desktop = { path = "../../crates/platform/desktop/player-host-desktop" }
player-plugin-loader = { package = "vesper-player-plugin-loader", path = "../../crates/plugin/player-plugin-loader" }
player-render-wgpu = { path = "../../crates/render/player-render-wgpu" }
player-runtime = { path = "../../crates/core/player-runtime" }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
skrifa = { version = "0.50.0", default-features = false, features = ["std"] }
tracing.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
player-platform-macos = { path = "../../crates/platform/desktop/player-platform-macos" }
