name: VesperPlayerHostDemo
options:
  bundleIdPrefix: io.github.ikaros.vesper.example
packages:
  VesperPlayerKit:
    path: ../../lib/ios/VesperPlayerKit
targets:
  VesperPlayerHostDemo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    dependencies:
      - package: VesperPlayerKit
        product: VesperPlayerKit
      - package: VesperPlayerKit
        product: VesperPlayerKitUI
      - framework: ../../lib/ios/VesperPlayerOptionalPlugins/Artifacts/VesperFFmpegAVCodec.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: ../../lib/ios/VesperPlayerOptionalPlugins/Artifacts/VesperFFmpegAVFormat.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: ../../lib/ios/VesperPlayerOptionalPlugins/Artifacts/VesperFFmpegAVUtil.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: ../../lib/ios/VesperPlayerOptionalPlugins/Artifacts/VesperPlayerRemuxFfmpegPlugin.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: ../../lib/ios/VesperPlayerOptionalPlugins/Artifacts/VesperPlayerSourceNormalizerFfmpegPlugin.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: ../../lib/ios/VesperPlayerOptionalPlugins/Artifacts/VesperPlayerDecoderVideoToolboxPlugin.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: ../../lib/ios/VesperPlayerOptionalPlugins/Artifacts/VesperPlayerFrameProcessorDiagnosticPlugin.xcframework
        embed: true
        link: false
        codeSign: true
    settings:
      base:
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ikaros.vesper.example.ioshost
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
    info:
      path: Sources/Info.plist
      properties:
        NSPhotoLibraryUsageDescription: This demo needs Photo Library access so you can pick videos for playback.
        NSPhotoLibraryAddUsageDescription: This demo needs Photo Library add access so you can save completed downloads.
        UIRequiresFullScreen: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
    scheme:
      testTargets:
        - VesperPlayerHostDemoTests
  VesperPlayerHostDemoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/VesperPlayerHostDemoTests
      - path: ../../fixtures/media/tiny-h264-aac.m4v
        buildPhase: resources
      - path: ../../fixtures/media/tiny-h264-bframes.m4v
        buildPhase: resources
    dependencies:
      - target: VesperPlayerHostDemo
      - package: VesperPlayerKit
        product: VesperPlayerKit
        link: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
