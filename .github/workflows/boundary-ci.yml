name: Vesper Boundary CI

on:
  pull_request:
    paths:
      - ".github/workflows/boundary-ci.yml"
      - ".github/workflows/**"
      - ".github/actions/setup-rust/**"
      - ".github/actions/setup-vesper-cli/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/tools/player-cli/**"
      - "scripts/**"
      - "plugins/**"
      - "fixtures/plugins/**"
      - "crates/ffi/**"
      - "crates/plugin/**"
      - "schemas/**"
      - "templates/**"
      - "wit/**"
      - "lib/android/**"
      - "lib/ios/VesperPlayerKit/**"
      - "lib/flutter/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/boundary-ci.yml"
      - ".github/workflows/**"
      - ".github/actions/setup-rust/**"
      - ".github/actions/setup-vesper-cli/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/tools/player-cli/**"
      - "scripts/**"
      - "plugins/**"
      - "fixtures/plugins/**"
      - "crates/ffi/**"
      - "crates/plugin/**"
      - "schemas/**"
      - "templates/**"
      - "wit/**"
      - "lib/android/**"
      - "lib/ios/VesperPlayerKit/**"
      - "lib/flutter/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boundary-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary-invariants:
    name: Boundary Invariant Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Rust version pins
        run: ./scripts/bump-rust-version.sh check

      - name: Set up Vesper CLI
        uses: ./.github/actions/setup-vesper-cli

      - name: Verify boundary invariants
        run: ./scripts/vesper contract boundary

      - name: Verify public contracts
        run: ./scripts/vesper contract verify
