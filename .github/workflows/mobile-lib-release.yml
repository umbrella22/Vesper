name: VesperPlayerKit Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to package and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-lib-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  LINUX_WORKSPACE_EXCLUDES: >-
    --exclude player-platform-macos
    --exclude player-platform-windows
    --exclude player-platform-ios
    --exclude player-ffi-ios
    --exclude player-platform-android
    --exclude player-jni-android

jobs:
  release-checks:
    name: Release Metadata and Lightweight Checks
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.release-channel.outputs.stable }}
      prerelease: ${{ steps.release-channel.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify release tag is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          main_commit="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$tag_commit" "$main_commit"; then
            echo "Release tag ${RELEASE_TAG} is not reachable from origin/main." >&2
            exit 1
          fi

      - name: Set up Vesper CLI
        uses: ./.github/actions/setup-vesper-cli

      - name: Classify release tag
        id: release-channel
        run: ./scripts/vesper release tag-channel "${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-desktop-deps

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Prepare release version metadata
        run: |
          ./scripts/vesper release prepare-from-tag "${RELEASE_TAG}"
          cargo build --locked --release -p vesper-player-cli --bin vesper

      - name: Verify generated FFI header
        run: ./scripts/vesper ffi verify

      - name: Verify FFmpeg source policy and profiles
        run: |
          ./scripts/vesper ffmpeg --platform all --profile default --dry-run
          cargo test -p vesper-player-cli --bin vesper ffmpeg -- --test-threads=1

      - name: Check Rust workspace
        run: cargo check --workspace ${{ env.LINUX_WORKSPACE_EXCLUDES }}

  android-lib:
    name: VesperPlayerKit Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    needs:
      - release-checks
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Vesper CLI
        uses: ./.github/actions/setup-vesper-cli

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Resolve Android SDK root
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.7.1"

      - name: Prepare release version metadata
        run: |
          ./scripts/vesper release prepare-from-tag "${RELEASE_TAG}"
          cargo build --locked --release -p vesper-player-cli --bin vesper

      - name: Build VesperPlayerKit Android release asset
        run: ./scripts/vesper android stage-release release-assets/android ${{ matrix.abi }}

      - name: Verify VesperPlayerKit Android assets are arm64-only
        shell: bash
        run: |
          set -euo pipefail

          if find release-assets/android -type f \( -name '*x86*' -o -name '*i386*' \) | grep -q .; then
            echo "Unexpected x86/i386 Android asset was staged." >&2
            find release-assets/android -type f \( -name '*x86*' -o -name '*i386*' \)
            exit 1
          fi

          while IFS= read -r -d '' aar; do
            if unzip -Z1 "$aar" | grep -E '(^|/)jni/(x86|x86_64)/' >/dev/null; then
              echo "Found unexpected x86 JNI payload in $aar" >&2
              unzip -Z1 "$aar" | grep -E '(^|/)jni/(x86|x86_64)/' >&2
              exit 1
            fi
          done < <(find release-assets/android -type f -name '*.aar' -print0)

          optional_artifacts=(
            "release-assets/android/VesperPlayerKitExternalPlayback-android-${{ matrix.abi }}.aar"
            "release-assets/android/VesperPlayerKitFfmpegRuntime-android-${{ matrix.abi }}.aar"
            "release-assets/android/VesperPlayerKitDecoderMediaCodec-android-${{ matrix.abi }}.aar"
            "release-assets/android/VesperPlayerKitSourceNormalizerFfmpeg-android-${{ matrix.abi }}.aar"
            "release-assets/android/VesperPlayerKitRemuxFfmpeg-android-${{ matrix.abi }}.aar"
            "release-assets/android/VesperPlayerKitFrameProcessorDiagnostic-android-${{ matrix.abi }}.aar"
          )
          for unexpected in "${optional_artifacts[@]}"; do
            if [[ -f "$unexpected" ]]; then
              echo "Default Android release must not stage optional plugin artifact: $unexpected" >&2
              exit 1
            fi
          done

      - name: Upload VesperPlayerKit Android release asset
        uses: actions/upload-artifact@v7
        with:
          name: VesperPlayerKit-android-${{ matrix.abi }}
          path: release-assets/android/*.aar

  android-samples:
    name: Vesper Android Sample APKs ${{ matrix.abi }}
    runs-on: ubuntu-latest
    needs:
      - release-checks
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Vesper CLI
        uses: ./.github/actions/setup-vesper-cli

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Resolve Android SDK root
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.7.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Prepare release version metadata
        run: |
          ./scripts/vesper release prepare-from-tag "${RELEASE_TAG}"
          cargo build --locked --release -p vesper-player-cli --bin vesper

      - name: Configure local Flutter package overrides
        run: ./scripts/vesper flutter local-overrides

      - name: Write Android local.properties
        run: |
          cat <<EOF > examples/android-compose-host/local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          EOF
          cat <<EOF > examples/flutter-host/android/local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          flutter.sdk=${FLUTTER_ROOT}
          EOF

      - name: Configure Flutter Android JNI sources
        shell: bash
        run: |
          set -euo pipefail
          real_flutter="$(command -v flutter)"
          test -x "$real_flutter"
          wrapper_dir="${RUNNER_TEMP}/vesper-flutter-bin"
          mkdir -p "$wrapper_dir"
          cat > "${wrapper_dir}/flutter" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          export VESPER_ANDROID_REMUX_JNI_LIBS="${GITHUB_WORKSPACE}/examples/flutter-host/build/app/generated/playerFfmpeg/jniLibs"
          export VESPER_ANDROID_SOURCE_NORMALIZER_JNI_LIBS="${GITHUB_WORKSPACE}/examples/flutter-host/build/app/generated/playerSourceNormalizerFfmpeg/jniLibs"
          export VESPER_ANDROID_FRAME_PROCESSOR_JNI_LIBS="${GITHUB_WORKSPACE}/examples/flutter-host/build/app/generated/playerFrameProcessorDiagnostic/jniLibs"
          exec "$real_flutter" "\$@"
          EOF
          chmod 700 "${wrapper_dir}/flutter"

      - name: Stage Android sample APKs
        run: |
          export PATH="${RUNNER_TEMP}/vesper-flutter-bin:${PATH}"
          test "$(command -v flutter)" = "${RUNNER_TEMP}/vesper-flutter-bin/flutter"
          ./scripts/vesper android sample-apks release-assets/android-samples ${{ matrix.abi }}

      - name: Verify Android sample APKs are arm64-only
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apk_files=(release-assets/android-samples/*.apk)
          if [[ ${#apk_files[@]} -ne 2 ]]; then
            echo "Expected exactly two Android sample APKs, found ${#apk_files[@]}." >&2
            printf '%s\n' "${apk_files[@]}" >&2
            exit 1
          fi

          for apk in "${apk_files[@]}"; do
            if unzip -Z1 "$apk" | grep -E '(^|/)lib/(x86|x86_64|armeabi-v7a)/' >/dev/null; then
              echo "Found unexpected non-arm64 JNI payload in $apk" >&2
              unzip -Z1 "$apk" | grep -E '(^|/)lib/(x86|x86_64|armeabi-v7a)/' >&2
              exit 1
            fi
          done

      - name: Upload Vesper Android sample APKs
        uses: actions/upload-artifact@v7
        with:
          name: VesperPlayerKit-android-samples-${{ matrix.abi }}
          path: release-assets/android-samples/*.apk

  ios-lib:
    name: VesperPlayerKit iOS arm64
    runs-on: macos-latest
    needs:
      - release-checks

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Vesper CLI
        uses: ./.github/actions/setup-vesper-cli

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install iOS build tools
        run: |
          brew untap aws/tap >/dev/null 2>&1 || true
          brew install xcodegen pkg-config

      - name: Select Xcode
        uses: ./.github/actions/select-xcode
        with:
          minimum-major: "16"

      - name: Prepare release version metadata
        run: |
          ./scripts/vesper release prepare-from-tag "${RELEASE_TAG}"
          cargo build --locked --release -p vesper-player-cli --bin vesper

      - name: Configure retrying source downloads
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/curl
          curl_wrapper="${RUNNER_TEMP}/vesper-curl-with-retry"
          cat > "$curl_wrapper" <<'EOF'
          #!/usr/bin/env bash
          exec /usr/bin/curl \
            --retry 5 \
            --retry-delay 5 \
            --retry-max-time 180 \
            --retry-all-errors \
            "$@"
          EOF
          chmod 700 "$curl_wrapper"
          echo "CURL=$curl_wrapper" >> "$GITHUB_ENV"

      - name: Build VesperPlayerKit iOS release assets
        run: ./scripts/vesper ios stage-release release-assets/ios --include-optional-plugins

      - name: Verify VesperPlayerKit iOS release assets
        run: ./scripts/vesper ios verify-release release-assets/ios --scope complete

      - name: Test core iOS release validation failures
        env:
          VESPER_IOS_CORE_RELEASE_FIXTURE: ${{ github.workspace }}/release-assets/ios
        run: >-
          cargo test -p vesper-player-cli --test ios_release_regressions
          ios_core_release_real_fixture_rejects_policy_drift
          -- --ignored --exact --nocapture --test-threads=1

      - name: Test optional iOS release validation failures
        env:
          VESPER_IOS_OPTIONAL_RELEASE_FIXTURE: ${{ github.workspace }}/release-assets/ios
        run: >-
          cargo test -p vesper-player-cli --test ios_release_regressions
          ios_optional_release_real_fixture_rejects_policy_drift
          -- --ignored --exact --nocapture --test-threads=1

      - name: Upload VesperPlayerKit iOS release assets
        uses: actions/upload-artifact@v7
        with:
          name: VesperPlayerKit-ios-arm64
          path: release-assets/ios/*
          if-no-files-found: error

  publish-release:
    name: Publish VesperPlayerKit Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - release-checks
      - android-lib
      - android-samples
      - ios-lib

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify release tag is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          main_commit="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$tag_commit" "$main_commit"; then
            echo "Release tag ${RELEASE_TAG} is not reachable from origin/main." >&2
            exit 1
          fi

      - name: Set up Vesper CLI
        uses: ./.github/actions/setup-vesper-cli

      - name: Download VesperPlayerKit release bundles
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release version metadata
        run: |
          ./scripts/vesper release prepare-from-tag "${RELEASE_TAG}"
          cargo build --locked --release -p vesper-player-cli --bin vesper

      - name: Generate VesperPlayerKit release notes
        run: ./scripts/vesper release notes "${RELEASE_TAG}" release-assets/RELEASE_NOTES.md

      - name: Generate VesperPlayerKit package checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          release_payloads=( *.aar *.zip *.apk *.tar.xz )
          if (( ${#release_payloads[@]} == 0 )); then
            echo "No GitHub Release payloads were staged." >&2
            exit 1
          fi
          LC_ALL=C shasum -a 256 "${release_payloads[@]}" > SHA256SUMS.txt

      - name: Reconcile and publish immutable stable GitHub release
        if: needs.release-checks.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          release_json="$temp_dir/release.json"
          release_error="$temp_dir/release-error.txt"
          expected_assets="$temp_dir/expected-assets.txt"
          expected_payloads="$temp_dir/expected-payloads.txt"

          shopt -s nullglob
          release_asset_paths=(
            release-assets/*.aar
            release-assets/*.zip
            release-assets/*.apk
            release-assets/*.tar.xz
            release-assets/SHA256SUMS.txt
          )
          shopt -u nullglob
          printf '%s\n' "${release_asset_paths[@]##*/}" | LC_ALL=C sort -u > "$expected_assets"
          grep -Fvx 'SHA256SUMS.txt' "$expected_assets" > "$expected_payloads"

          verify_remote_release() {
            local compare_local_hashes="$1"
            local remote_dir="$temp_dir/remote-assets"
            local actual_assets="$temp_dir/actual-assets.txt"
            local manifest_assets="$temp_dir/manifest-assets.txt"
            local local_hashes="$temp_dir/local-hashes.txt"
            local remote_hashes="$temp_dir/remote-hashes.txt"

            rm -rf "$remote_dir"
            mkdir -p "$remote_dir"
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$remote_dir"
            find "$remote_dir" -maxdepth 1 -type f -printf '%f\n' \
              | LC_ALL=C sort -u > "$actual_assets"
            if ! diff -u "$expected_assets" "$actual_assets"; then
              echo "GitHub Release assets do not match the verified release set." >&2
              exit 1
            fi

            awk '
              NF == 2 && length($1) == 64 && $1 ~ /^[0-9a-fA-F]+$/ &&
                $2 ~ /^[A-Za-z0-9][A-Za-z0-9._+-]*$/ { print $2; next }
              { exit 1 }
            ' "$remote_dir/SHA256SUMS.txt" | LC_ALL=C sort -u > "$manifest_assets"
            if ! diff -u "$expected_payloads" "$manifest_assets"; then
              echo "Published SHA256SUMS.txt does not cover the exact release payload set." >&2
              exit 1
            fi
            (
              cd "$remote_dir"
              shasum -a 256 --check SHA256SUMS.txt
            )

            if [[ "$compare_local_hashes" == "true" ]]; then
              for path in "${release_asset_paths[@]}"; do
                hash="$(shasum -a 256 "$path" | awk '{print $1}')"
                printf '%s  %s\n' "$hash" "${path##*/}"
              done | LC_ALL=C sort -k2 > "$local_hashes"
              for path in "$remote_dir"/*; do
                hash="$(shasum -a 256 "$path" | awk '{print $1}')"
                printf '%s  %s\n' "$hash" "${path##*/}"
              done | LC_ALL=C sort -k2 > "$remote_hashes"
              if ! diff -u "$local_hashes" "$remote_hashes"; then
                echo "Draft release assets differ from the locally verified build." >&2
                exit 1
              fi
            fi
          }

          if ! gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets \
            > "$release_json" 2> "$release_error"; then
            if ! grep -Fqx -- 'release not found' "$release_error"; then
              cat "$release_error" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "VesperPlayerKit ${RELEASE_TAG}" \
              --notes-file release-assets/RELEASE_NOTES.md
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease,assets \
              > "$release_json"
          fi

          if [[ "$(jq -r '.tagName' "$release_json")" != "$RELEASE_TAG" ]]; then
            echo "GitHub returned a release for an unexpected tag." >&2
            exit 1
          fi
          if [[ "$(jq -r '.isPrerelease' "$release_json")" != "false" ]]; then
            echo "Existing stable release ${RELEASE_TAG} is marked as a prerelease." >&2
            exit 1
          fi

          if [[ "$(jq -r '.isDraft' "$release_json")" == "false" ]]; then
            verify_remote_release false
            echo "Existing published stable release is complete and immutable."
            exit 0
          fi

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "VesperPlayerKit ${RELEASE_TAG}" \
            --notes-file release-assets/RELEASE_NOTES.md

          while IFS= read -r asset_name; do
            [[ -n "$asset_name" ]] || continue
            if ! grep -Fqx -- "$asset_name" "$expected_assets"; then
              gh release delete-asset "$RELEASE_TAG" "$asset_name" \
                --repo "$GITHUB_REPOSITORY" \
                --yes
            fi
          done < <(jq -r '.assets[].name' "$release_json")

          gh release upload "$RELEASE_TAG" \
            "${release_asset_paths[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          verify_remote_release true

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft=false \
            --prerelease=false
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets \
            > "$release_json"
          if [[ "$(jq -r '.isDraft' "$release_json")" != "false" || \
                "$(jq -r '.isPrerelease' "$release_json")" != "false" ]]; then
            echo "Stable release did not become a published non-prerelease." >&2
            exit 1
          fi

      - name: Publish VesperPlayerKit GitHub prerelease
        if: needs.release-checks.outputs.stable != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: VesperPlayerKit ${{ env.RELEASE_TAG }}
          body_path: release-assets/RELEASE_NOTES.md
          prerelease: true
          overwrite_files: true
          files: |
            release-assets/*.aar
            release-assets/*.zip
            release-assets/*.apk
            release-assets/*.tar.xz
            release-assets/SHA256SUMS.txt

      - name: Reconcile VesperPlayerKit GitHub prerelease assets
        if: needs.release-checks.outputs.stable != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          expected_assets="$temp_dir/expected-assets.txt"
          actual_assets="$temp_dir/actual-assets.txt"

          shopt -s nullglob
          release_asset_paths=(
            release-assets/*.aar
            release-assets/*.zip
            release-assets/*.apk
            release-assets/*.tar.xz
            release-assets/SHA256SUMS.txt
          )
          shopt -u nullglob
          printf '%s\n' "${release_asset_paths[@]##*/}" | LC_ALL=C sort -u > "$expected_assets"

          while IFS= read -r remote_asset; do
            [[ -n "$remote_asset" ]] || continue
            if ! grep -Fqx -- "$remote_asset" "$expected_assets"; then
              gh release delete-asset "$RELEASE_TAG" "$remote_asset" --yes
            fi
          done < <(
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'
          )

          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort -u > "$actual_assets"
          if ! diff -u "$expected_assets" "$actual_assets"; then
            echo "GitHub Release assets do not match the locally verified release set." >&2
            exit 1
          fi

  publish-maven-central:
    name: Publish VesperPlayerKit to Maven Central
    runs-on: ubuntu-latest
    needs:
      - release-checks
      - publish-release
    environment: maven-central

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || format('refs/tags/{0}', env.RELEASE_TAG) }}

      - name: Verify manual Maven publisher repair scope
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          while IFS= read -r changed_path; do
            case "$changed_path" in
              .github/workflows/mobile-lib-release.yml | \
              crates/tools/player-cli/src/android_publish.rs)
                ;;
              *)
                echo "Manual Maven repair includes a frozen product change: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$tag_commit" HEAD)

      - name: Set up Vesper CLI
        uses: ./.github/actions/setup-vesper-cli

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Resolve Android SDK root
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.7.1"

      - name: Prepare release version metadata
        run: |
          ./scripts/vesper release prepare-from-tag "${RELEASE_TAG}"
          cargo build --locked --release -p vesper-player-cli --bin vesper

      - name: Publish signed Maven Central deployment
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_NAMESPACE: ${{ vars.MAVEN_NAMESPACE }}
        run: |
          set -euo pipefail
          namespace="${MAVEN_NAMESPACE:-io.github.umbrella22}"
          publish_log="$(mktemp)"
          trap 'rm -f "$publish_log"' EXIT

          set +e
          ./scripts/vesper android publish-maven-central \
            "${RELEASE_TAG}" \
            --namespace "$namespace" 2>&1 | tee "$publish_log"
          publish_status="${PIPESTATUS[0]}"
          set -e
          if (( publish_status == 0 )); then
            exit 0
          fi

          # v0.4.1 is immutable and carries the pre-fix publisher. Accept only
          # its known Portal PURL alias mismatch, then prove the signed public
          # coordinates are available before treating the retry as successful.
          if [[ "$RELEASE_TAG" != "v0.4.1" ]] || \
             ! grep -Fqx -- \
               'Central deployment components do not match the expected coordinates' \
               "$publish_log"; then
            exit "$publish_status"
          fi

          expected_components="$(mktemp)"
          reported_components="$(mktemp)"
          canonical_components="$(mktemp)"
          trap 'rm -f "$publish_log" "$expected_components" "$reported_components" "$canonical_components"' EXIT
          version="${VESPER_RELEASE_PUBLICATION_VERSION}"
          artifacts=(
            vesper-player-kit
            vesper-player-kit-compose
            vesper-player-kit-compose-ui
          )
          for artifact in "${artifacts[@]}"; do
            printf 'pkg:maven/io.github.umbrella22.vesper/%s@%s\n' \
              "$artifact" "$version"
          done | LC_ALL=C sort -u > "$expected_components"
          sed -n 's/^  actual: //p' "$publish_log" \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -Fvxe '' \
            > "$reported_components"
          sed 's/[?]type=aar$//' "$reported_components" \
            | LC_ALL=C sort -u \
            > "$canonical_components"
          if ! diff -u "$expected_components" "$canonical_components"; then
            exit "$publish_status"
          fi

          repository="https://repo.maven.apache.org/maven2/io/github/umbrella22/vesper"
          for artifact in "${artifacts[@]}"; do
            base_url="${repository}/${artifact}/${version}/${artifact}-${version}"
            for suffix in pom pom.asc aar aar.asc; do
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --retry 12 \
                --retry-delay 10 \
                --retry-all-errors \
                --max-time 240 \
                --output /dev/null \
                "${base_url}.${suffix}"
            done
          done
          echo "Verified published Maven Central coordinates for ${RELEASE_TAG}."

      - name: Verify hosted external-playback Android app dependency closure
        if: env.RELEASE_TAG != 'v0.4.1'
        shell: bash
        run: |
          set -euo pipefail
          version="${VESPER_RELEASE_PUBLICATION_VERSION}"
          repository="https://repo.maven.apache.org/maven2/io/github/umbrella22/vesper"
          artifacts=(
            vesper-player-kit
            vesper-player-kit-ffmpeg-runtime
            vesper-player-kit-external-playback
            vesper-player-kit-source-normalizer-ffmpeg
            vesper-player-kit-remux-ffmpeg
          )

          for attempt in $(seq 1 60); do
            missing=()
            for artifact in "${artifacts[@]}"; do
              base="${repository}/${artifact}/${version}/${artifact}-${version}"
              if ! curl --fail --silent --location \
                --max-time 30 --output /dev/null "${base}.pom" || \
                 ! curl --fail --silent --location \
                --max-time 30 --output /dev/null "${base}.aar"; then
                missing+=("$artifact")
              fi
            done
            if (( ${#missing[@]} == 0 )); then
              break
            fi
            if (( attempt == 60 )); then
              printf 'Hosted Maven coordinate is unavailable: %s\n' \
                "${missing[@]}" >&2
              exit 1
            fi
            echo "Waiting for hosted Maven coordinates ($attempt/60)."
            sleep 10
          done

          gradle \
            -p fixtures/plugins/android-aar-consumer \
            -Pvesper.mavenVersion="$version" \
            :app:assembleRelease

  publish-swift-package:
    name: Publish VesperPlayerKit Swift Package
    runs-on: macos-latest
    needs:
      - release-checks
      - publish-release
    environment: swift-package

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Vesper CLI
        uses: ./.github/actions/setup-vesper-cli

      - name: Download released XCFrameworks
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "${RELEASE_TAG}"
          --repo "${GITHUB_REPOSITORY}"
          --pattern VesperPlayerKit.xcframework.zip
          --pattern VesperFFmpegAVCodec.xcframework.zip
          --pattern VesperFFmpegAVFormat.xcframework.zip
          --pattern VesperFFmpegAVUtil.xcframework.zip
          --pattern VesperPlayerRemuxFfmpegPlugin.xcframework.zip
          --pattern VesperPlayerSourceNormalizerFfmpegPlugin.xcframework.zip
          --dir release-assets/ios

      - name: Publish remote Swift package index
        env:
          SPM_PUBLISH_TOKEN: ${{ secrets.SPM_PUBLISH_TOKEN }}
          SPM_REPOSITORY: ${{ vars.SPM_REPOSITORY }}
        run: >-
          ./scripts/vesper ios publish-spm-index
          "${RELEASE_TAG}"
          release-assets/ios/VesperPlayerKit.xcframework.zip
          --source-repository "${GITHUB_REPOSITORY}"

      - name: Verify remote Swift package tag
        env:
          SPM_REPOSITORY: ${{ vars.SPM_REPOSITORY }}
        run: |
          repository="${SPM_REPOSITORY:-umbrella22/VesperPlayerKit}"
          git ls-remote --exit-code \
            "https://github.com/$repository.git" \
            "refs/tags/${RELEASE_TAG}"
