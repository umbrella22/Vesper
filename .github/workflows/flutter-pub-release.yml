name: Vesper Flutter Pub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: flutter-pub-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  publish-flutter-packages:
    name: Publish Flutter packages to pub.dev
    runs-on: ubuntu-latest
    environment: pub.dev
    if: startsWith(github.ref_name, 'v')

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Vesper CLI
        uses: ./.github/actions/setup-vesper-cli

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          ./scripts/vesper release tag-channel "$tag" >> "$GITHUB_OUTPUT"

      - name: Prepare release version metadata
        run: |
          ./scripts/vesper release prepare-from-tag "${RELEASE_TAG}"
          cargo build --locked --release -p vesper-player-cli --bin vesper

      - name: Wait for hosted native dependencies
        shell: bash
        timeout-minutes: 180
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.publication_version }}"
          maven_root="https://repo.maven.apache.org/maven2/io/github/umbrella22/vesper"
          swift_package="https://github.com/umbrella22/VesperPlayerKit.git"
          artifacts=(
            vesper-player-kit
            vesper-player-kit-compose
            vesper-player-kit-compose-ui
            vesper-player-kit-ffmpeg-runtime
            vesper-player-kit-external-playback
            vesper-player-kit-source-normalizer-ffmpeg
            vesper-player-kit-remux-ffmpeg
          )

          for attempt in $(seq 1 540); do
            missing=()
            for artifact in "${artifacts[@]}"; do
              base="$maven_root/$artifact/$version/$artifact-$version"
              if ! curl --fail --silent --location \
                --max-time 30 --output /dev/null "$base.pom" || \
                 ! curl --fail --silent --location \
                --max-time 30 --output /dev/null "$base.aar"; then
                missing+=("$artifact")
              fi
            done
            swift_ready=false
            if git ls-remote --exit-code "$swift_package" \
              "refs/tags/v$version" >/dev/null 2>&1; then
              swift_ready=true
            fi
            if [[ "$swift_ready" == true ]] && (( ${#missing[@]} == 0 )); then
              echo "Hosted native dependencies are available for $version."
              break
            fi
            if (( attempt == 540 )); then
              echo "Hosted native dependencies did not become available for $version." >&2
              if [[ "$swift_ready" != true ]]; then
                echo "Missing Swift package tag: v$version" >&2
              fi
              if (( ${#missing[@]} > 0 )); then
                printf 'Missing Maven coordinate: %s\n' "${missing[@]}" >&2
              fi
              exit 1
            fi
            echo "Waiting for hosted native dependencies ($attempt/540)."
            sleep 20
          done

      - name: Set up Dart pub authentication
        uses: dart-lang/setup-dart@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Publish Flutter packages
        run: >-
          ./scripts/vesper flutter pub-publish
          /tmp/vesper-flutter-pub-release
          "${VESPER_RELEASE_PUBLICATION_VERSION}"
          --include-optional-plugins
