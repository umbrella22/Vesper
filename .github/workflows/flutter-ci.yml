name: Vesper Flutter CI

on:
  pull_request:
    paths:
      - ".github/workflows/flutter-ci.yml"
      - ".github/actions/select-xcode/**"
      - ".github/actions/setup-vesper-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/tools/player-cli/**"
      - "scripts/**"
      - "plugins/**"
      - "schemas/**"
      - "templates/**"
      - "wit/**"
      - "fixtures/plugins/**"
      - "crates/model/**"
      - "crates/core/**"
      - "crates/ffi/**"
      - "crates/plugin/**"
      - "crates/audio/**"
      - "crates/render/**"
      - "crates/backend/**"
      - "crates/plugin-decoder/**"
      - "crates/plugin-remux/**"
      - "crates/platform/common/**"
      - "crates/platform/mobile/**"
      - "crates/platform/jni/**"
      - "lib/android/**"
      - "lib/ios/VesperPlayerKit/**"
      - "lib/ios/VesperPlayerOptionalPlugins/**"
      - "lib/flutter/**"
      - "examples/flutter-host/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/flutter-ci.yml"
      - ".github/actions/select-xcode/**"
      - ".github/actions/setup-vesper-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/tools/player-cli/**"
      - "scripts/**"
      - "plugins/**"
      - "schemas/**"
      - "templates/**"
      - "wit/**"
      - "fixtures/plugins/**"
      - "crates/model/**"
      - "crates/core/**"
      - "crates/ffi/**"
      - "crates/plugin/**"
      - "crates/audio/**"
      - "crates/render/**"
      - "crates/backend/**"
      - "crates/plugin-decoder/**"
      - "crates/plugin-remux/**"
      - "crates/platform/common/**"
      - "crates/platform/mobile/**"
      - "crates/platform/jni/**"
      - "lib/android/**"
      - "lib/ios/VesperPlayerKit/**"
      - "lib/ios/VesperPlayerOptionalPlugins/**"
      - "lib/flutter/**"
      - "examples/flutter-host/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    name: Flutter Shared Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Vesper CLI
        uses: ./.github/actions/setup-vesper-cli

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate local Flutter dependency overrides
        run: ./scripts/vesper flutter local-overrides

      - name: Analyze and test shared Flutter packages
        shell: bash
        run: |
          set -euo pipefail

          for pkg_dir in \
            lib/flutter/vesper_player_platform_interface \
            lib/flutter/vesper_player \
            lib/flutter/vesper_player_ui \
            lib/flutter/vesper_player_source_normalizer_ffmpeg
          do
            echo "::group::$pkg_dir"
            (
              cd "$pkg_dir"
              flutter pub get
              flutter analyze
              if [[ -d test ]]; then
                flutter test
              else
                echo "No test/ directory; skipping flutter test."
              fi
            )
            echo "::endgroup::"
          done

      - name: Flutter pub publish dry-run
        run: >-
          ./scripts/vesper flutter pub-dry-run
          /tmp/vesper-flutter-pub-dry-run

  flutter-android:
    name: Flutter Android Host ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            flutter_target: android-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Vesper CLI
        uses: ./.github/actions/setup-vesper-cli

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Verify generated FFI header
        run: ./scripts/vesper ffi verify

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve Android SDK root
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build Android FFmpeg runtime AAR
        run: ./scripts/vesper ffmpeg --platform android --profile default --abi ${{ matrix.abi }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate local Flutter dependency overrides
        run: ./scripts/vesper flutter local-overrides

      - name: Write Android local.properties
        run: |
          cat <<EOF > examples/flutter-host/android/local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          flutter.sdk=${FLUTTER_ROOT}
          EOF

      - name: Write Flutter Android gradle.properties
        run: |
          cat <<EOF > examples/flutter-host/android/gradle.properties
          org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          # Flutter 3.47 still consumes AGP's legacy DSL and external Kotlin plugin.
          android.newDsl=false
          android.builtInKotlin=false
          vesper.player.android.abis=${{ matrix.abi }}
          vesper.player.android.app.abis=${{ matrix.abi }}
          vesper.player.android.ffmpegProfile=default
          vesper.player.android.external.ffmpegProfile=default
          EOF

      - name: Check Android bridge crates
        run: cargo check -p player-platform-android -p player-jni-android

      - name: Test Android bridge crates
        run: cargo test -p player-platform-android -p player-jni-android

      - name: Analyze and test Flutter Android packages
        shell: bash
        run: |
          set -euo pipefail

          for pkg_dir in \
            lib/flutter/vesper_player_android \
            lib/flutter/vesper_player_external_playback
          do
            echo "::group::$pkg_dir"
            (
              cd "$pkg_dir"
              flutter pub get
              flutter analyze
              if [[ -d test ]]; then
                flutter test
              else
                echo "No test/ directory; skipping flutter test."
              fi
            )
            echo "::endgroup::"
          done

      - name: Install Flutter dependencies
        working-directory: examples/flutter-host
        run: flutter pub get

      - name: Run Flutter Android plugin Kotlin unit tests
        run: >-
          gradle -p examples/flutter-host/android
          -Pvesper.player.android.abis=${{ matrix.abi }}
          :vesper_player_android:testDebugUnitTest

      - name: Analyze Flutter Android host
        working-directory: examples/flutter-host
        run: flutter analyze

      - name: Test Flutter Android host
        working-directory: examples/flutter-host
        run: flutter test

      - name: Build Flutter Android host release
        working-directory: examples/flutter-host
        run: flutter build apk --release --target-platform ${{ matrix.flutter_target }}

      - name: Verify Flutter Android host release excludes test fixtures
        run: >-
          ./scripts/vesper flutter verify-android-release
          examples/flutter-host/build/app/outputs/flutter-apk/app-release.apk

      - name: Stage Flutter Android release APK
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p artifacts/flutter-android
          cp \
            examples/flutter-host/build/app/outputs/flutter-apk/app-release.apk \
            artifacts/flutter-android/flutter-host-${{ matrix.abi }}-release.apk

      - name: Upload Flutter Android release APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: flutter-host-android-${{ matrix.abi }}-release-apk
          path: artifacts/flutter-android/*.apk

  flutter-ios:
    name: Flutter iOS Host arm64
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Vesper CLI
        uses: ./.github/actions/setup-vesper-cli

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install iOS build tools
        run: |
          brew untap aws/tap >/dev/null 2>&1 || true
          brew install pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Select Xcode
        uses: ./.github/actions/select-xcode
        with:
          minimum-major: "16"

      - name: Stage canonical optional iOS plugin XCFrameworks
        run: ./scripts/vesper ios stage-optional-plugins-release /tmp/vesper-flutter-ios-optional-plugins-release --profile source-normalizer ios-arm64 ios-simulator-arm64

      - name: Build Rust iOS resolver bundle
        run: ./scripts/vesper ios ffi release

      - name: Show Flutter version
        run: flutter --version

      - name: Generate local Flutter dependency overrides
        run: ./scripts/vesper flutter local-overrides

      - name: Flutter optional plugin pub publish dry-run
        shell: bash
        run: |
          set -euo pipefail

          stage="$RUNNER_TEMP/vesper-flutter-optional-pub-dry-run"
          ./scripts/vesper flutter stage-pub "$stage" --include-optional-plugins
          (
            cd "$stage/vesper_player_source_normalizer_ffmpeg"
            flutter pub get
            flutter pub publish --dry-run
          )

      - name: Enable Swift Package Manager
        run: |
          flutter config --enable-swift-package-manager
          flutter config

      - name: Install Flutter dependencies
        working-directory: examples/flutter-host
        run: flutter pub get

      - name: Configure Flutter iOS SwiftPM deployment target
        working-directory: examples/flutter-host
        run: |
          flutter build ios --release --config-only --no-codesign
          grep -F -- '.iOS("17.0")' ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift

      - name: Check iOS bridge crates
        run: cargo check -p player-platform-ios -p player-ffi-ios

      - name: Test iOS bridge crates
        run: cargo test -p player-platform-ios -p player-ffi-ios

      - name: Verify VesperPlayerKit bridge shim
        run: ./scripts/vesper ios verify-bridge-shim

      - name: Analyze and test Flutter iOS package
        shell: bash
        run: |
          set -euo pipefail

          pkg_dir="lib/flutter/vesper_player_ios"
          echo "::group::$pkg_dir"
          (
            cd "$pkg_dir"
            flutter pub get
            flutter analyze
            if [[ -d test ]]; then
              flutter test
            else
              echo "No test/ directory; skipping flutter test."
            fi
          )
          echo "::endgroup::"

      - name: Analyze Flutter iOS host
        working-directory: examples/flutter-host
        run: flutter analyze

      - name: Test Flutter iOS host
        working-directory: examples/flutter-host
        run: flutter test

      - name: Select Flutter iOS Simulator
        shell: bash
        run: |
          set -euo pipefail

          simulator_record="$(
            xcrun simctl list devices available --json | ruby -rjson -e '
              devices = JSON.parse($stdin.read).fetch("devices").flat_map do |runtime_identifier, runtime_devices|
                match = runtime_identifier.match(/SimRuntime\.iOS-(\d+)(?:-(\d+))?(?:-(\d+))?\z/)
                next [] unless match
                version = [match[1].to_i, match[2].to_s.to_i, match[3].to_s.to_i]
                next [] if (version <=> [17, 0, 0]) < 0
                runtime_devices.map { |device| device.merge("_runtimeVersion" => version) }
              end.select do |device|
                device["isAvailable"] != false && device.fetch("name", "").start_with?("iPhone")
              end
              selected = devices.select { |device| device["state"] == "Booted" }
                .max_by { |device| device.fetch("_runtimeVersion") } ||
                devices.max_by { |device| device.fetch("_runtimeVersion") }
              abort("No available iPhone Simulator with iOS 17 or newer was found.") unless selected
              puts "#{selected.fetch("udid")}\t#{selected.fetch("state")}"
            '
          )"
          IFS=$'\t' read -r simulator_id simulator_state <<< "$simulator_record"
          if [[ "$simulator_state" != "Booted" ]]; then
            xcrun simctl boot "$simulator_id"
          fi
          xcrun simctl bootstatus "$simulator_id" -b
          echo "VESPER_FLUTTER_IOS_SIMULATOR=$simulator_id" >> "$GITHUB_ENV"

      - name: Run Flutter iOS subtitle integration
        id: subtitle_integration
        shell: bash
        working-directory: examples/flutter-host
        timeout-minutes: 30
        run: |
          set -euo pipefail

          evidence_dir="$RUNNER_TEMP/flutter-subtitle-evidence"
          log_dir="$RUNNER_TEMP/flutter-subtitle-logs"
          mkdir -p "$evidence_dir" "$log_dir"
          status=0

          run_subtitle_integration() {
            local evidence_name="$1"
            local target="$2"
            local -a pipeline_status
            local command_status
            local tee_status
            set +e
            VESPER_SUBTITLE_EVIDENCE_DIR="$evidence_dir" \
            VESPER_SUBTITLE_EVIDENCE_NAME="$evidence_name" \
              flutter drive \
                --driver=test_driver/subtitle_integration_test.dart \
                --target="$target" \
                --device-id "$VESPER_FLUTTER_IOS_SIMULATOR" \
                2>&1 | tee "$log_dir/$evidence_name.log"
            pipeline_status=("${PIPESTATUS[@]}")
            command_status="${pipeline_status[0]}"
            tee_status="${pipeline_status[1]}"
            set -e
            if [[ "$command_status" -ne 0 || "$tee_status" -ne 0 ]]; then
              status=1
            fi
          }

          run_subtitle_integration subtitle-positive integration_test/subtitle_contract_test.dart
          run_subtitle_integration subtitle-lifecycle integration_test/subtitle_lifecycle_test.dart

          required_evidence=(
            "$evidence_dir/subtitle-positive.json"
            "$evidence_dir/subtitle-positive.png"
            "$evidence_dir/subtitle-lifecycle.json"
          )
          for evidence_path in "${required_evidence[@]}"; do
            if [[ ! -s "$evidence_path" ]]; then
              echo "Missing required subtitle evidence: $evidence_path" >&2
              status=1
            fi
          done

          if ! ruby -rjson -e '
            positive = JSON.parse(File.read(ARGV.fetch(0)))
            snapshot = positive.fetch("snapshot")
            frame = snapshot.fetch("frame")
            abort("Positive subtitle evidence is not visibly attached") unless
              positive["evidenceName"] == "subtitle-positive" &&
                snapshot["text"] == "Subtitle B" && snapshot["visible"] == true &&
                snapshot["hidden"] == false && snapshot["windowAttached"] == true &&
                snapshot.fetch("alpha").to_f > 0 && frame.fetch("width").to_f > 0 &&
                frame.fetch("height").to_f > 0
            abort("Positive subtitle evidence PNG is invalid") unless
              File.binread(ARGV.fetch(1), 8) == "\x89PNG\r\n\x1a\n".b

            lifecycle = JSON.parse(File.read(ARGV.fetch(2)))
            scenarios = lifecycle.fetch("scenarios")
            {
              "timeout" => "subtitle_selection_timeout",
              "sourceChange" => "subtitle_source_changed",
              "supersede" => "subtitle_selection_superseded"
            }.each do |name, code|
              abort("Unexpected #{name} subtitle evidence") unless
                scenarios.fetch(name).fetch("error").fetch("code") == code
            end
          ' \
            "$evidence_dir/subtitle-positive.json" \
            "$evidence_dir/subtitle-positive.png" \
            "$evidence_dir/subtitle-lifecycle.json"; then
            status=1
          fi
          exit "$status"

      - name: Upload Flutter iOS subtitle evidence
        if: always() && steps.subtitle_integration.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: flutter-ios-subtitle-simulator-evidence
          path: |
            ${{ runner.temp }}/flutter-subtitle-evidence
            ${{ runner.temp }}/flutter-subtitle-logs
          if-no-files-found: error
          retention-days: 14

      - name: Build Flutter iOS host release
        working-directory: examples/flutter-host
        run: flutter build ios --release --no-codesign

      - name: Verify Flutter iOS host App Store framework layout
        run: ./scripts/vesper ios verify-app-store-layout examples/flutter-host/build/ios/iphoneos/Runner.app
