name: Set up Vesper CLI
description: Install the workspace Rust toolchain, build the release CLI, and export VESPER_CLI.

runs:
  using: composite
  steps:
    - name: Install Rust 1.98
      uses: dtolnay/rust-toolchain@1.98.0

    - name: Cache Rust artifacts
      uses: Swatinem/rust-cache@v2

    - name: Build Vesper CLI
      shell: bash
      run: cargo build --locked --release -p player-cli --bin vesper

    - name: Export VESPER_CLI
      shell: bash
      run: |
        if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
          workspace="$(cygpath -m "${GITHUB_WORKSPACE}")"
          install_dir="$(cygpath -m "${RUNNER_TEMP}")/vesper-cli"
          built_cli="$workspace/target/release/vesper.exe"
          cli="$install_dir/vesper.exe"
        else
          install_dir="${RUNNER_TEMP}/vesper-cli"
          built_cli="${GITHUB_WORKSPACE}/target/release/vesper"
          cli="$install_dir/vesper"
        fi
        if [[ ! -x "$built_cli" ]]; then
          echo "Built Vesper CLI is not executable: $built_cli" >&2
          exit 1
        fi
        mkdir -p "$install_dir"
        cp "$built_cli" "$cli"
        chmod +x "$cli"
        if [[ ! -x "$cli" ]]; then
          echo "Installed Vesper CLI is not executable: $cli" >&2
          exit 1
        fi
        echo "VESPER_CLI=$cli" >> "$GITHUB_ENV"
