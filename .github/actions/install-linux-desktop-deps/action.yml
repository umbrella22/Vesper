name: Install Linux desktop dependencies
description: Install shared Linux packages required by the desktop Rust workspace.

runs:
  using: composite
  steps:
    - name: Install Linux desktop packages
      shell: bash
      run: |
        set -euo pipefail

        sudo apt-get update
        sudo apt-get install -y \
          ffmpeg \
          pkg-config \
          clang \
          libclang-dev \
          libavcodec-dev \
          libavformat-dev \
          libavutil-dev \
          libavfilter-dev \
          libswresample-dev \
          libswscale-dev \
          libasound2-dev \
          libudev-dev \
          libegl1-mesa-dev \
          libgl1-mesa-dev \
          libx11-dev \
          libx11-xcb-dev \
          libxcb1-dev \
          libxrandr-dev \
          libxi-dev \
          libxcursor-dev \
          libxinerama-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libwayland-dev
