description = "Experimental diagnostic FrameProcessor plugin for native-frame conformance testing."
license = "Apache-2.0"
publisher = "io.github.umbrella22"

[compatibility]
host_sdk = ">=0.4.2, <0.5.0"
abi_major = 1
abi_minor_min = 0
