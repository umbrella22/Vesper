name: vesper_player_remux_ffmpeg
description: Optional FFmpeg post-download remux native artifacts for Vesper Player Flutter hosts.
version: 0.5.1
homepage: https://github.com/umbrella22/Vesper
repository: https://github.com/umbrella22/Vesper

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.umbrella22.vesper.player.flutter.remux_ffmpeg
        pluginClass: VesperPlayerRemuxFfmpegPlugin
      ios:
        pluginClass: VesperPlayerRemuxFfmpegPlugin
