group = "io.github.umbrella22.vesper.player.flutter.externalplayback"
version = "0.5.1"

ext.vesperPlayerKitVersion = providers
    .gradleProperty("vesperPlayerKitVersion")
    .orElse(version.toString())
    .get()

buildscript {
    ext.kotlin_version = "2.4.10"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:9.1.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

def sdkRootDir = projectDir.parentFile.parentFile.parentFile.parentFile
def androidKitDir = new File(sdkRootDir, "lib/android")

def hostKitProject = findProject(":vesper-player-kit")
def flutterAndroidProject = findProject(":vesper_player_android")
def externalPlaybackProject = findProject(":vesper-player-kit-external-playback")

android {
    namespace = "io.github.umbrella22.vesper.player.flutter.externalplayback"
    compileSdk = 36

    defaultConfig {
        minSdk = 26
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        profile {
            initWith release
            matchingFallbacks = ["release"]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    if (hostKitProject != null) {
        implementation project(":vesper-player-kit")
    } else if (flutterAndroidProject != null) {
        implementation project(":vesper_player_android")
    } else {
        implementation "io.github.umbrella22.vesper:vesper-player-kit:$vesperPlayerKitVersion"
    }

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

    if (externalPlaybackProject != null) {
        implementation project(":vesper-player-kit-external-playback")
    } else {
        implementation "io.github.umbrella22.vesper:vesper-player-kit-external-playback:$vesperPlayerKitVersion"
    }
}
