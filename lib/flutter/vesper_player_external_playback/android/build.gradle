group = "io.github.ikaros.vesper.player.flutter.externalplayback"
version = "0.1.0"

buildscript {
    ext.kotlin_version = "2.3.10"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:9.1.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "io.github.ikaros.vesper.player.flutter.externalplayback"
    compileSdk = 36

    defaultConfig {
        minSdk = 26
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    def castProject = findProject(":vesper-player-kit-cast")
    def relayProject = findProject(":vesper-player-kit-relay")
    def dlnaProject = findProject(":vesper-player-kit-dlna")
    if (castProject == null || relayProject == null || dlnaProject == null) {
        throw new GradleException(
            "vesper_player_external_playback requires ':vesper-player-kit-cast', " +
            "':vesper-player-kit-relay', and ':vesper-player-kit-dlna' to be included in the Android build."
        )
    }
    implementation castProject
    implementation relayProject
    implementation dlnaProject
}
