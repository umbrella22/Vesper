name: vesper_player_android
description: Android implementation for Vesper Player, requiring API 26+, arm64-v8a, and a 64-bit app process. 32-bit Android is unsupported.
version: 0.6.5
homepage: https://github.com/umbrella22/Vesper
repository: https://github.com/umbrella22/Vesper

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.47.2"

dependencies:
  flutter:
    sdk: flutter
  vesper_player_platform_interface: ^0.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: vesper_player
    platforms:
      android:
        package: io.github.umbrella22.vesper.player.flutter.android
        pluginClass: VesperPlayerAndroidPlugin
        dartPluginClass: VesperPlayerAndroid
