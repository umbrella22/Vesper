group = "io.github.ikaros.vesper.player.flutter.android"
version = "0.4.0"

ext.vesperPlayerKitVersion = providers
    .gradleProperty("vesperPlayerKitVersion")
    .orElse(version.toString())
    .get()

buildscript {
    ext.kotlin_version = "2.3.10"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:9.1.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "io.github.ikaros.vesper.player.flutter.android"
    compileSdk = 36

    defaultConfig {
        minSdk = 26
        consumerProguardFiles "consumer-rules.pro"
    }

    // Flutter creates a profile build type for the host application. Keep the
    // plugin's profile artifact aligned with the optimized release host kit.
    buildTypes {
        profile {
            initWith release
            matchingFallbacks = ["release"]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    def hostKitProject = findProject(":vesper-player-kit")
    if (hostKitProject != null) {
        implementation project(":vesper-player-kit")
    } else {
        implementation "io.github.ikaros.vesper:vesper-player-kit:$vesperPlayerKitVersion"
    }

    implementation "androidx.activity:activity:1.8.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    testImplementation "junit:junit:4.13.2"
}
