[package]
name = "player-decoder-mediacodec"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "vesper_decoder_mediacodec"
crate-type = ["cdylib", "rlib"]

[dependencies]
player-plugin = { package = "vesper-player-plugin", path = "../../plugin/player-plugin" }
tracing.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
player-plugin-abi = { package = "vesper-player-plugin-abi", path = "../../plugin/player-plugin-abi" }
serde.workspace = true
serde_json.workspace = true
