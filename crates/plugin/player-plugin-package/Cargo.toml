[package]
name = "vesper-player-plugin-package"
description = "Deterministic signed package and trust-store primitives for Vesper plugins."
authors.workspace = true
version.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/vesper-player-plugin-package"
readme = "../../../README.md"
keywords = ["vesper", "plugin", "signing", "package"]
categories = ["development-tools"]
publish = ["crates-io"]

[lib]
name = "player_plugin_package"

[dependencies]
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
player-plugin = { package = "vesper-player-plugin", version = "0.5.0", path = "../player-plugin" }
player-plugin-abi = { package = "vesper-player-plugin-abi", version = "0.5.0", path = "../player-plugin-abi" }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
unicode-casefold.workspace = true
unicode-normalization.workspace = true
uuid.workspace = true
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }
